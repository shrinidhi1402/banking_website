[project]
name = "crq-ai-knowledge"
version = "0.1.0"
description = "CRQ Knowledge & Retrieval Layer — RAG service for semantic context retrieval"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "sentence-transformers>=3.0,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
