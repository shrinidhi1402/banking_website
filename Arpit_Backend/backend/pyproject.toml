[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crq"
version = "0.1.0"
description = "CyberRisk Quantifier — AI-powered cyber risk quantification platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Validation & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Database — async SQLAlchemy + Postgres driver
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Redis (async)
    "redis[hiredis]>=5.0.8",

    # MinIO / S3
    "minio>=7.2.8",

    # HTTP client
    "httpx>=0.27.0",

    # Logging
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",

    # Observability
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",

    # Task queue
    "celery[redis]>=5.4.0",

    # AI / ML (stubs — used in later phases)
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pulp>=2.9.0",
    "networkx>=3.3",

    # Templating
    "jinja2>=3.1.4",

    # Async Kafka (Redpanda)
    "aiokafka>=0.11.0",

    # Correlation ID
    "asgi-correlation-id>=4.3.1",

    # Rate limiting (B5 — pre-import for middleware)
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "httpx>=0.27.0",         # async test client
    "anyio>=4.4.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.8.0",
    # Type stubs
    "types-redis>=4.6.0",
    "types-python-jose>=3.3.4",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crq"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforce type hints)
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function call in argument defaults (standard FastAPI Depends/Query)
    "ANN401", # dynamically typed Any expressions
    "S101", # assert in tests is fine
    "S105", # dev default passwords in config defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# MyPy — strict mode
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "celery.*",
    "minio.*",
    "pulp.*",
    "networkx.*",
    "structlog.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "asgi_correlation_id.*",
    "slowapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "crq.workers.tasks.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: unit tests (no external deps)",
    "integration: integration tests (requires docker-compose up)",
    "property: hypothesis property-based tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/crq"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0  # Will raise threshold in later phases
